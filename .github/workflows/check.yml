name: contract-checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - run: genvm-lint check contracts/specsignal.py
      - run: pytest -q
      - run: python fixtures/build_fixture.py && git diff --exit-code fixtures/
